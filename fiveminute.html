<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Пʼятихвилинки</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">

  <!-- Иконки -->
  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="/fiveminute-icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    sizes="192x192"
    href="/fiveminute-icon-192.png"
  >

  <meta name="application-name" content="Пʼятихвилинки">
  <meta name="apple-mobile-web-app-title" content="Пʼятихвилинки">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="theme-color" content="#A96A7C">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f3f7f7;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      text-align: center;
      padding: 32px;
    }

    .icon {
      width: 110px;
      height: 110px;
      border-radius: 26px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,.12);
    }

    h1 {
      margin: 0 0 8px;
      color: #263238;
      font-size: 28px;
    }

    p {
      margin: 0;
      color: #879395;
      font-size: 15px;
    }

    .loader {
      width: 32px;
      height: 32px;
      margin: 28px auto 0;
      border: 3px solid #e2e7e8;
      border-top-color: #A96A7C;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="app">
    <img
      class="icon"
      src="/fiveminute-icon-192.png"
      alt="Пʼятихвилинки"
    >

    <h1>Пʼятихвилинки</h1>

    <p>Відкриваємо мобільний додаток...</p>

    <div class="loader"></div>
  </div>

  <script>
    const APP_URL =
      'https://script.google.com/macros/s/AKfycbyggxzcfJSav6S73WrFn-aYso53yb_u0OXU2n57CrkIg016yuuVMM4Do25XonvZA2d6/exec';

    /*
      ВАЖНО:
      Не делаем мгновенный redirect.

      Когда страницу открывают впервые в браузере,
      она остаётся на sp-automation.com, чтобы Android
      увидел manifest и правильную иконку.

      Когда приложение уже запущено с главного экрана
      в standalone-режиме — открываем Apps Script.
    */

    const standalone =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    if (standalone) {
      window.location.replace(APP_URL);
    }
  </script>

</body>
</html>
