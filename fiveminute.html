<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Пʼятихвилинки</title>

  <link rel="manifest" href="/manifest.json">

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="/fiveminute-icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    sizes="192x192"
    href="/fiveminute-icon-192.png"
  >

  <meta name="application-name" content="Пʼятихвилинки">
  <meta name="apple-mobile-web-app-title" content="Пʼятихвилинки">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#A96A7C">

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #f3f8f8;
  }

  #loginScreen {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
      radial-gradient(
        circle at 50% 35%,
        #ffffff 0%,
        #f3f8f8 55%,
        #edf4f4 100%
      );
  }

  .loginCard {
    width: 100%;
    max-width: 380px;

    padding: 34px 30px 28px;

    display: flex;
    flex-direction: column;
    align-items: center;

    background: rgba(255,255,255,.97);

    border: 1px solid #dce5e5;
    border-radius: 28px;

    text-align: center;

    box-shadow:
      0 18px 45px rgba(30,55,58,.10);
  }

  .appIcon {
    display: block;

    width: 84px;
    height: 84px;

    margin: 0 0 18px;

    object-fit: cover;

    border-radius: 22px;

    box-shadow:
      0 8px 20px rgba(0,0,0,.12);
  }

  h1 {
    margin: 0;

    font-size: 29px;
    line-height: 1.15;
    font-weight: 700;

    color: #263638;
  }

  .subtitle {
    margin-top: 7px;
    margin-bottom: 26px;

    font-size: 15px;
    line-height: 1.3;

    color: #8a989a;
  }

  /*
    Контейнер Google-кнопки.
    Это важно: сама кнопка Google рендерится
    своим iframe, поэтому центрируем контейнер.
  */
  .g_id_signin {
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    margin: 0;
  }

  #status {
    width: 100%;
    min-height: 20px;

    margin-top: 18px;

    text-align: center;

    color: #667476;
    font-size: 13px;
    line-height: 1.4;
  }

  #status:empty {
    min-height: 0;
    margin-top: 0;
  }

  #status.error {
    margin-top: 18px;
    color: #b3261e;
  }

  .loginHint {
    width: 100%;

    margin-top: 28px;
    padding-top: 20px;

    border-top: 1px solid #edf1f1;

    color: #899698;
    font-size: 12px;
    line-height: 1.5;

    text-align: center;
  }

  #appFrame {
    display: none;

    width: 100%;
    height: 100%;

    border: 0;

    background: #f5f6f8;
  }

  /* Телефон */
  @media (max-width: 480px) {

    #loginScreen {
      padding: 16px;
    }

    .loginCard {
      max-width: 360px;

      padding:
        30px
        22px
        26px;

      border-radius: 26px;
    }

    .appIcon {
      width: 78px;
      height: 78px;

      border-radius: 20px;

      margin-bottom: 17px;
    }

    h1 {
      font-size: 27px;
    }

    .subtitle {
      margin-bottom: 24px;
    }

    .loginHint {
      margin-top: 26px;
      padding-top: 18px;
    }
  }
</style>
</head>

<body>

  <div id="loginScreen">

    <div class="loginCard">

      <img
        class="appIcon"
        src="/fiveminute-icon-192.png"
        alt="Пʼятихвилинки"
      >

      <h1>Пʼятихвилинки</h1>

      <div class="subtitle">
        Мобільна версія
      </div>

      <div
        id="g_id_onload"
        data-client_id="628554556154-bo05hmpt62cplj6rs894nhso95njq1ab.apps.googleusercontent.com"
        data-callback="handleGoogleLogin"
        data-auto_prompt="false"
        data-cancel_on_tap_outside="false"
      ></div>

      <div
        class="g_id_signin"
        data-type="standard"
        data-shape="pill"
        data-theme="outline"
        data-text="signin_with"
        data-size="large"
        data-logo_alignment="left"
        data-width="300"
      ></div>

      <div id="status"></div>

      <div class="loginHint">
        Доступ дозволено лише авторизованим
        Google-акаунтам клініки.
      </div>

    </div>

  </div>


  <iframe
    id="appFrame"
    name="appFrame"
    allow="camera; microphone; fullscreen"
  ></iframe>


  <form
    id="loginForm"
    method="POST"
    target="appFrame"
    action="https://script.google.com/macros/s/AKfycbyggxzcfJSav6S73WrFn-aYso53yb_u0OXU2n57CrkIg016yuuVMM4Do25XonvZA2d6/exec"
    style="display:none;"
  >
    <input
      type="hidden"
      id="credentialInput"
      name="credential"
      value=""
    >
  </form>


  <script>
    let loginStarted = false;

    function handleGoogleLogin(response) {

      if (loginStarted) {
        return;
      }

      const credential =
        String(
          response &&
          response.credential
            ? response.credential
            : ''
        ).trim();

      if (!credential) {
        showError(
          'Не вдалося отримати дані Google-акаунта.'
        );

        return;
      }

      loginStarted = true;

      const status =
        document.getElementById('status');

      status.classList.remove('error');

      status.textContent =
        'Перевіряємо доступ...';

      document.getElementById(
        'credentialInput'
      ).value = credential;

      const frame =
        document.getElementById(
          'appFrame'
        );

      /*
        Показываем iframe только после того,
        как Apps Script реально вернул страницу.
      */

      frame.onload = function() {

        document.getElementById(
          'loginScreen'
        ).style.display = 'none';

        frame.style.display = 'block';
      };

      document.getElementById(
        'loginForm'
      ).submit();
    }


    function showError(message) {

      const status =
        document.getElementById('status');

      status.classList.add('error');

      status.textContent =
        message;

      loginStarted = false;
    }
  </script>

</body>
</html>
