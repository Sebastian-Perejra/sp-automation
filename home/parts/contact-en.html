<button
  id="contact-float-btn"
  type="button"
  onclick="openContactModal()"
>
  <span class="float-action-icon">
    ↗
  </span>

  <span class="float-action-copy">
    <strong>Message Sebastian</strong>
    <small>Directly, no middlemen</small>
  </span>

  <span class="float-action-arrow">→</span>
</button>

<div
  id="contact-modal"
  class="contact-modal-overlay"
  onclick="handleOverlayClick(event)"
>
  <div class="contact-modal">
    <button
      class="contact-close"
      type="button"
      aria-label="Close"
      onclick="closeContactModal()"
    >
      ×
    </button>

    <div class="form-modal-kicker">
      LET'S TALK
    </div>

    <h3>
      What is slowing your process down?
    </h3>

    <p class="form-modal-intro">
      Describe the task in your own words.
      No briefs. No long forms.
    </p>

    <div class="form-field">
      <label for="contact-name">
        Your name
      </label>

      <input
        id="contact-name"
        type="text"
        placeholder="For example, Alex"
      >
    </div>

    <div class="form-field">
      <label>
        How should I contact you?
      </label>

      <div class="contact-method-options">
        <button
          type="button"
          class="contact-method-btn"
          onclick="selectContactMethod('email', this)"
        >
          <span>✉</span>
          Email
        </button>

        <button
          type="button"
          class="contact-method-btn"
          onclick="selectContactMethod('phone', this)"
        >
          <span>☎</span>
          Phone
        </button>

        <button
          type="button"
          class="contact-method-btn"
          onclick="selectContactMethod('telegram', this)"
        >
          <span>✈</span>
          Telegram
        </button>
      </div>

      <input
        id="contact-method"
        type="text"
        placeholder="Choose a contact method"
        disabled
      >

      <input
        id="contact-method-type"
        type="hidden"
        value=""
      >
    </div>

    <div class="form-field">
      <label for="contact-message">
        Briefly about the task
      </label>

      <textarea
        id="contact-message"
        rows="5"
        placeholder="What are you doing manually now, or what would you like to simplify?"
      ></textarea>
    </div>

    <div class="form-security">
      <span>Secure submission</span>

      <div class="turnstile-wrapper">
        <div
          class="cf-turnstile"
          data-sitekey="0x4AAAAAAEC2VWGc6kZPcKO6"
        ></div>
      </div>
    </div>

    <button
      class="contact-send-btn"
      type="button"
      onclick="testContactForm()"
    >
      Send message
      <span>→</span>
    </button>

    <div id="contact-status"></div>

    <div class="contact-modal-note">
      Your message goes directly to me.
    </div>
  </div>
</div>
