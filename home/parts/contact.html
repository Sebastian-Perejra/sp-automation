<button
  id="contact-float-btn"
  type="button"
  onclick="openContactModal()"
>
  <span class="float-action-icon">
    ↗
  </span>

  <span class="float-action-copy">
    <strong>Написати Себастьяну</strong>
    <small>Напряму, без менеджерів</small>
  </span>

  <span class="float-action-arrow">→</span>
</button>

<div
  id="contact-modal"
  class="contact-modal-overlay"
  onclick="handleOverlayClick(event)"
>
  <div class="contact-modal">
    <button
      class="contact-close"
      type="button"
      aria-label="Закрити"
      onclick="closeContactModal()"
    >
      ×
    </button>

    <div class="form-modal-kicker">
      LET'S TALK
    </div>

    <h3>
      Що у вашому процесі забирає час?
    </h3>

    <p class="form-modal-intro">
      Опишіть задачу своїми словами.
      Без брифів і довгих анкет.
    </p>

    <div class="form-field">
      <label for="contact-name">
        Ваше ім'я
      </label>

      <input
        id="contact-name"
        type="text"
        placeholder="Наприклад, Олександр"
      >
    </div>

    <div class="form-field">
      <label>
        Як з вами зв'язатися?
      </label>

      <div class="contact-method-options">
        <button
          type="button"
          class="contact-method-btn"
          onclick="selectContactMethod('email', this)"
        >
          <span>✉</span>
          Пошта
        </button>

        <button
          type="button"
          class="contact-method-btn"
          onclick="selectContactMethod('phone', this)"
        >
          <span>☎</span>
          Телефон
        </button>

        <button
          type="button"
          class="contact-method-btn"
          onclick="selectContactMethod('telegram', this)"
        >
          <span>✈</span>
          Telegram
        </button>
      </div>

      <input
        id="contact-method"
        type="text"
        placeholder="Оберіть спосіб зв'язку"
        disabled
      >

      <input
        id="contact-method-type"
        type="hidden"
        value=""
      >
    </div>

    <div class="form-field">
      <label for="contact-message">
        Коротко про задачу
      </label>

      <textarea
        id="contact-message"
        rows="5"
        placeholder="Що зараз доводиться робити вручну або що хочеться спростити?"
      ></textarea>
    </div>

    <div class="form-security">
      <span>Захищене надсилання</span>

      <div class="turnstile-wrapper">
        <div
          class="cf-turnstile"
          data-sitekey="0x4AAAAAAEC2VWGc6kZPcKO6"
        ></div>
      </div>
    </div>

    <button
      class="contact-send-btn"
      type="button"
      onclick="testContactForm()"
    >
      Надіслати повідомлення
      <span>→</span>
    </button>

    <div id="contact-status"></div>

    <div class="contact-modal-note">
      Повідомлення потрапляє безпосередньо мені.
    </div>
  </div>
</div>
