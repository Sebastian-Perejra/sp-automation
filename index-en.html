<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Sebastian Perejra – Business Process Automation</title>

  <meta
    name="description"
    content="Business process automation with Excel, VBA, Power Query, Power BI, Google Sheets, Google Apps Script, web apps, Telegram bots and integrations."
  >

  <meta name="robots" content="index, follow">

  <link
    rel="canonical"
    href="https://sp-automation.com/index-en.html"
  >

  <link
    rel="alternate"
    hreflang="uk"
    href="https://sp-automation.com/"
  >

  <link
    rel="alternate"
    hreflang="en"
    href="https://sp-automation.com/index-en.html"
  >

  <link
    rel="alternate"
    hreflang="ru"
    href="https://sp-automation.com/index-ru.html"
  >

  <link
    rel="alternate"
    hreflang="x-default"
    href="https://sp-automation.com/"
  >

  <meta
    property="og:title"
    content="Sebastian Perejra – Business Process Automation"
  >

  <meta
    property="og:description"
    content="Excel, VBA, Power Query, Power BI, Google Sheets, Google Apps Script, web apps, Telegram bots, integrations and business process automation."
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://sp-automation.com/index-en.html"
  >

  <meta
    property="og:locale"
    content="en_US"
  >

  <meta
    property="og:locale:alternate"
    content="uk_UA"
  >

  <meta
    property="og:locale:alternate"
    content="ru_RU"
  >

  <link
    rel="icon"
    href="/favicon.png"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/assistant.css"
  >

  <link
    rel="stylesheet"
    href="/nav-font-kaleidoscope.css"
  >

  <link
    rel="stylesheet"
    href="/home/home.css"
  >

  <link
  rel="stylesheet"
  href="/themes/noir-lime/estimator/pricing-estimator.css?v=1"
  >

  <link
    rel="stylesheet"
    href="/components/components.css"
  >

  <link
    rel="stylesheet"
    href="/consent/consent.css"
  >

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js"
    async
    defer
  ></script>

  <script
    src="/assistant.js"
    defer
  ></script>

  <script
    src="/components/components.js"
    defer
  ></script>

  <script
    src="/home/home.js"
    defer
  ></script>

  <script
    src="/consent/consent.js"
    defer
  ></script>
</head>

<body>
  <div id="site-header-slot"></div>

  <section class="home-hero">
    <div
      class="hero-sheen"
      aria-hidden="true"
    ></div>

    <div class="hero-inline">
      <img
        src="/home/assets/avatar.png"
        alt="Avatar"
      >

      <div class="hero-name-wrap">
        <div class="typewriter">
          Sebastian Perejra
        </div>

        <button
          class="workspace-peek-btn"
          type="button"
          aria-label="Take a look behind the scenes"
          title="Take a look behind the scenes"
          onclick="openWorkspacePeek()"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M8 3H3v5"></path>
            <path d="M3 3l6 6"></path>
            <path d="M16 3h5v5"></path>
            <path d="M21 3l-6 6"></path>
            <path d="M8 21H3v-5"></path>
            <path d="M3 21l6-6"></path>
            <path d="M16 21h5v-5"></path>
            <path d="M21 21l-6-6"></path>
          </svg>
        </button>
      </div>
    </div>

    <p>
      I automate and visualize everything that can be automated.
      And the rest — I’ll probably try too.
    </p>

    <button
      class="cta-button solution-picker-btn"
      type="button"
      onclick="openSolutionPicker()"
    >
      ⚡ Find the right solution
    </button>
  </section>

  <div
    class="workspace-peek-overlay"
    id="workspace-peek"
    aria-hidden="true"
    onclick="handleWorkspacePeekClick(event)"
  >
    <div class="workspace-peek-window">
      <button
        class="workspace-peek-close"
        type="button"
        aria-label="Close"
        onclick="closeWorkspacePeek()"
      >
        ×
      </button>

      <div class="workspace-peek-frame">
        <img
          src="/home/assets/workspace.webp"
          alt="Sebastian's workspace"
          class="workspace-peek-image"
        >

        <div class="workspace-peek-shade"></div>

        <div class="workspace-peek-caption">
          <span class="workspace-peek-dot"></span>
          Somewhere, something is being automated right now
        </div>
      </div>
    </div>
  </div>

  <div
    class="hint"
    id="hint"
  ></div>

  <div class="carousel-container">
    <div
      class="carousel"
      id="carousel"
    >
      <img
        src="/home/assets/excel.png"
        style="--i:0"
        alt="Excel"
      >

      <img
        src="/home/assets/powerbi.png"
        style="--i:1"
        alt="Power BI"
      >

      <img
        src="/home/assets/sheets.png"
        style="--i:2"
        alt="Google Sheets"
      >

      <img
        src="/home/assets/JavaScript.png"
        style="--i:3"
        alt="JavaScript"
      >

      <img
        src="/home/assets/vba.png"
        style="--i:4"
        alt="VBA"
      >

      <img
        src="/home/assets/powerquery.png"
        style="--i:5"
        alt="Power Query"
      >

      <img
        src="/home/assets/power-pivot.png"
        style="--i:6"
        alt="Power Pivot"
      >

      <img
        src="/home/assets/tgbot.png"
        style="--i:7"
        alt="Telegram Bot"
      >

      <img
        src="/home/assets/googledrive.png"
        style="--i:8"
        alt="Google Drive"
      >

      <img
        src="/home/assets/webapp.png"
        style="--i:9"
        alt="Web App"
      >
    </div>
  </div>

  <div id="home-reviews-slot"></div>
  <div id="home-contact-slot"></div>
  <div id="home-solution-picker-slot"></div>

  <button
  class="pricing-estimator-trigger home-estimator-hidden-trigger"
  type="button"
  aria-hidden="true"
  tabindex="-1"
></button>

<div
  class="pricing-estimator-overlay"
  aria-hidden="true"
></div>

<aside
  class="pricing-estimator-panel"
  aria-hidden="true"
  aria-label="Project cost calculator"
>
  <button
    class="pricing-estimator-close"
    type="button"
    aria-label="Close calculator"
  >
    ×
  </button>

  <div class="pricing-estimator-panel-inner">
    <div class="pricing-estimator-panel-kicker">
      Preliminary estimate
    </div>

    <h2 class="pricing-estimator-panel-title">
      Estimate project cost
    </h2>

    <p class="pricing-estimator-panel-text">
      Answer a few short questions to get an approximate project estimate.
    </p>

    <div class="pricing-estimator-progress">
      <div class="pricing-estimator-progress-head">
        <span class="pricing-estimator-progress-label">
          Start
        </span>

        <span class="pricing-estimator-progress-value">
          0%
        </span>
      </div>

      <div class="pricing-estimator-progress-track">
        <span class="pricing-estimator-progress-bar"></span>
      </div>
    </div>

    <div class="pricing-estimator-content"></div>

    <div class="pricing-estimator-navigation">
      <button
        class="pricing-estimator-back"
        type="button"
        disabled
      >
        ← Back
      </button>

      <button
        class="pricing-estimator-reset"
        type="button"
      >
        Reset
      </button>
    </div>

    <button
      class="pricing-estimator-tired"
      type="button"
    >
          I’m done answering — send a request
        </button>
      </div>
    </aside>
  
  <div id="site-footer-slot"></div>
  <script
  src="/themes/noir-lime/estimator/pricing-estimator-en.js?v=1"
  defer
></script>
</body>
</html>
