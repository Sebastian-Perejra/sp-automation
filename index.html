  <link rel="canonical" href="https://sp-automation.com/">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script

  <link rel="stylesheet" href="/assistant.css">
  <link rel="stylesheet" href="nav-font-kaleidoscope.css">

<body>
  <div id="site-header-slot"></div>

  <section class="home-hero">
    <div class="hero-inline">
      <img src="/home/assets/avatar.png" alt="Avatar">
      <div class="typewriter">Себастьян Перейра</div>
    </div>

    <p>Автоматизую і візуалізую все, що можна. А інше — теж спробую.</p>

    <button

  <div class="carousel-container">
    <div class="carousel" id="carousel">
      <img src="/home/assets/excel.png" style="--i:0" alt="Excel">
      <img src="/home/assets/powerbi.png" style="--i:1" alt="Power BI">
      <img src="/home/assets/sheets.png" style="--i:2" alt="Google Sheets">
      <img src="/home/assets/JavaScript.png" style="--i:3" alt="JavaScript">

      <img src="/home/assets/tgbot.png" style="--i:7" alt="Telegram Bot">
      <img src="/home/assets/googledrive.png" style="--i:8" alt="Google Drive">
      <img src="/home/assets/webapp.png" style="--i:9" alt="Web App">
    </div>
  </div>

  <div id="home-reviews-slot"></div>
  <div id="home-contact-slot"></div>

  <div id="site-footer-slot"></div>
