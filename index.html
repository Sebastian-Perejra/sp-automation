  >

  <link
    rel="alternate"
    hreflang="ru"
    href="https://sp-automation.com/index-ru.html"
  >

  <link
    rel="alternate"
    hreflang="x-default"
    href="https://sp-automation.com/"
  >

  <meta
    property="og:title"
    content="Себастьян Перейра – Автоматизація бізнес-процесів"
  >

  <meta
    property="og:description"
    content="Excel, VBA, Power Query, Power BI, Google Sheets, Google Apps Script, вебзастосунки, Telegram-боти, інтеграції та автоматизація бізнес-процесів."
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta

    content="https://sp-automation.com/"

  <meta

    content="uk_UA"

  <meta
    property="og:locale:alternate"
    content="en_US"
  >

    property="og:locale:alternate"
    content="ru_RU"
  >

  <link
    rel="icon"
    href="/favicon.png"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/assistant.css"
  >

  <link
    rel="stylesheet"
    href="/nav-font-kaleidoscope.css"
  >

  <link
    rel="stylesheet"
    href="/home/home.css"
  >

  <link
    rel="stylesheet"
    href="/components/components.css"
  >

  <link
    rel="stylesheet"
    href="/consent/consent.css"
  >

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js"
    async
    defer
  ></script>

  <script
    src="/assistant.js"
    defer
  ></script>

  <script
    src="/components/components.js"
    defer
  ></script>

  <script
    src="/home/home.js"
    defer
  ></script>

  <script
    src="/consent/consent.js"
    defer
  ></script>
</head>

<body>
  <div id="site-header-slot"></div>

  <section class="home-hero">
    <div class="hero-inline">
  <img
    src="/home/assets/avatar.png"
    alt="Avatar"
  >

  <div class="hero-name-wrap">
    <div class="typewriter">
      Себастьян Перейра
    </div>

    <button
      class="workspace-peek-btn"
      type="button"
      aria-label="Зазирнути за лаштунки"
      title="Зазирнути за лаштунки"
      onclick="openWorkspacePeek()"
    >
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M8 3H3v5"></path>
        <path d="M3 3l6 6"></path>
        <path d="M16 3h5v5"></path>
        <path d="M21 3l-6 6"></path>
        <path d="M8 21H3v-5"></path>
        <path d="M3 21l6-6"></path>
        <path d="M16 21h5v-5"></path>
        <path d="M21 21l-6-6"></path>
      </svg>
    </button>
  </div>
</div>

    <p>
      Автоматизую і візуалізую все, що можна. А інше — теж спробую.
    </p>

    <button
      class="cta-button solution-picker-btn"
      type="button"
      onclick="openSolutionPicker()"
    >
      ⚡ Підібрати рішення
    </button>
  </section>

  <div
  class="workspace-peek-overlay"
  id="workspace-peek"
  aria-hidden="true"
  onclick="handleWorkspacePeekClick(event)"
>
  <div class="workspace-peek-window">
    <button
      class="workspace-peek-close"
      type="button"
      aria-label="Закрити"
      onclick="closeWorkspacePeek()"
    >
      ×
    </button>

    <div class="workspace-peek-frame">
      <img
        src="/home/assets/workspace.webp"
        alt="Робоче місце Себастьяна"
        class="workspace-peek-image"
      >

      <div class="workspace-peek-shade"></div>

      <div class="workspace-peek-caption">
        <span class="workspace-peek-dot"></span>
        Десь зараз щось автоматизується
      </div>
    </div>
  </div>
</div>
  <div
    class="hint"
    id="hint"
  ></div>

  <div class="carousel-container">
    <div
      class="carousel"
      id="carousel"
    >
      <img
        src="/home/assets/excel.png"
        style="--i:0"
        alt="Excel"
      >

      <img
        src="/home/assets/powerbi.png"
        style="--i:1"
        alt="Power BI"
      >

      <img
        src="/home/assets/sheets.png"
        style="--i:2"
        alt="Google Sheets"
      >

      <img
        src="/home/assets/JavaScript.png"
        style="--i:3"
        alt="JavaScript"
      >

      <img
        src="/home/assets/vba.png"
        style="--i:4"
        alt="VBA"
      >

      <img
        src="/home/assets/powerquery.png"
        style="--i:5"
        alt="Power Query"
      >

      <img
        src="/home/assets/power-pivot.png"
        style="--i:6"
        alt="Power Pivot"
      >

      <img
        src="/home/assets/tgbot.png"
        style="--i:7"
        alt="Telegram Bot"
      >

      <img
        src="/home/assets/googledrive.png"
        style="--i:8"
        alt="Google Drive"
      >

      <img
        src="/home/assets/webapp.png"
        style="--i:9"
        alt="Web App"
      >
    </div>
  </div>

  <div id="home-reviews-slot"></div>
  <div id="home-contact-slot"></div>
  <div id="home-solution-picker-slot"></div>

  <div id="site-footer-slot"></div>
</body>
</html>
