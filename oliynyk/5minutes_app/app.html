<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Пʼятихвилинки</title>

  <link rel="manifest" href="./manifest.json">

<link
  rel="icon"
  type="image/png"
  sizes="192x192"
  href="./fiveminute-icon-192.png"
>

<link
  rel="apple-touch-icon"
  sizes="192x192"
  href="./fiveminute-icon-192.png"
>

  <meta name="application-name" content="Пʼятихвилинки">
  <meta name="apple-mobile-web-app-title" content="Пʼятихвилинки">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#A96A7C">

  <style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #f3f8f8;
  }

  #loginScreen {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
      radial-gradient(
        circle at 50% 35%,
        #ffffff 0%,
        #f3f8f8 55%,
        #edf4f4 100%
      );
  }

  .loginCard {
    width: 100%;
    max-width: 380px;
    min-height: 430px;

    padding: 34px 30px 28px;

    display: flex;
    flex-direction: column;
    align-items: center;

    background: rgba(255,255,255,.97);

    border: 1px solid #dce5e5;
    border-radius: 28px;

    text-align: center;

    box-shadow:
      0 18px 45px rgba(30,55,58,.10);
  }

  .appIcon {
    display: block;

    width: 84px;
    height: 84px;

    margin: 0 0 18px;

    object-fit: cover;

    border-radius: 22px;

    box-shadow:
      0 8px 20px rgba(0,0,0,.12);
  }

  h1 {
    margin: 0;

    font-size: 29px;
    line-height: 1.15;
    font-weight: 700;

    color: #263638;
  }

  .subtitle {
    margin-top: 7px;
    margin-bottom: 26px;

    font-size: 15px;
    line-height: 1.3;

    color: #8a989a;
  }

  .g_id_signin {
  width: 100%;
  min-height: 44px;

  display: flex;
  justify-content: center;
  align-items: center;

  margin: 0;
}

 .authStep {
  width: 100%;
}

.authStep.hidden {
  display: none;
}

.authInput {
  width: 100%;
  height: 48px;
  padding: 0 16px;
  margin-bottom: 12px;
  border: 1px solid #d8e0e1;
  border-radius: 14px;
  font-size: 16px;
  outline: none;
  background: #ffffff;
  color: #263638;
}

.authInput:focus {
  border-color: #A96A7C;
}

.authBtn {
  width: 100%;
  height: 48px;
  border: 0;
  border-radius: 14px;
  background: #A96A7C;
  color: #ffffff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.authBtn:disabled {
  opacity: .55;
  cursor: default;
}
    
  #status {
    width: 100%;
    min-height: 20px;

    margin-top: 18px;

    text-align: center;

    color: #667476;
    font-size: 13px;
    line-height: 1.4;
  }

  #status.error {
    margin-top: 18px;
    color: #b3261e;
  }

  .loginHint {
    width: 100%;

    margin-top: 28px;
    padding-top: 20px;

    border-top: 1px solid #edf1f1;

    color: #899698;
    font-size: 12px;
    line-height: 1.5;

    text-align: center;
  }

  #appFrame {
  display: none;

  width: 100%;
  height: 100%;

  border: 0;

  background: #f5f6f8;

  opacity: 0;
  transform: scale(.965);
  filter: blur(7px);

  transition:
    opacity .6s ease,
    transform .65s cubic-bezier(.16, 1, .3, 1),
    filter .55s ease;
}

#appFrame.appReady {
  opacity: 1;
  transform: scale(1);
  filter: blur(0);
}

#loginScreen {
  transition: opacity .22s ease;
}

  /* Телефон */
  @media (max-width: 480px) {

    #loginScreen {
      padding: 16px;
    }

    .loginCard {
      max-width: 360px;

      padding:
        30px
        22px
        26px;

      border-radius: 26px;
    }

    .appIcon {
      width: 78px;
      height: 78px;

      border-radius: 20px;

      margin-bottom: 17px;
    }

    h1 {
      font-size: 27px;
    }

    .subtitle {
      margin-bottom: 24px;
    }

    .loginHint {
      margin-top: 26px;
      padding-top: 18px;
    }
  }
</style>
</head>

<body>

  <div id="loginScreen">

    <div class="loginCard">

      <img
        class="appIcon"
        src="./fiveminute-icon-192.png"
        alt="Пʼятихвилинки"
      >

      <h1>Пʼятихвилинки</h1>

      <div class="subtitle">
        Мобільна версія
      </div>

<div id="passwordStep" class="authStep">
  <input
    id="passwordInput"
    class="authInput"
    type="password"
    placeholder="Загальний пароль"
    autocomplete="current-password"
  >

  <button
    id="passwordBtn"
    class="authBtn"
    type="button"
  >
    Продовжити
  </button>
</div>

<div id="emailStep" class="authStep hidden">
  <input
    id="emailInput"
    class="authInput"
    type="email"
    placeholder="Ваш email"
    autocomplete="email"
  >

  <button
    id="emailBtn"
    class="authBtn"
    type="button"
  >
    Надіслати код
  </button>
</div>

<div id="codeStep" class="authStep hidden">
  <input
    id="codeInput"
    class="authInput"
    type="text"
    inputmode="numeric"
    maxlength="6"
    placeholder="Код з листа"
    autocomplete="one-time-code"
  >

  <button
    id="codeBtn"
    class="authBtn"
    type="button"
  >
    Увійти
  </button>
</div>

      <div id="status"></div>

<div class="loginHint">
  Для входу потрібен загальний пароль
  та підтвердження через дозволений email.
</div>

    </div>

  </div>


  <iframe
    id="appFrame"
    name="appFrame"
    allow="camera; microphone; fullscreen"
  ></iframe>


  <form
    id="loginForm"
    method="POST"
    target="appFrame"
    action="https://script.google.com/macros/s/AKfycbzT5Z8RYIKjH0h_Oj7giOgoyTRJlcPbp5kUnoJzZEwKQIYWQqgX6dX6GNtwCoeoVySe/exec"
    style="display:none;"
  >

    <input
  type="hidden"
  id="sessionTokenInput"
  name="sessionToken"
  value=""
>
  </form>

  <iframe
  id="authFrame"
  name="authFrame"
  style="display:none;"
></iframe>

<form
  id="authForm"
  method="POST"
  target="authFrame"
  action="https://script.google.com/macros/s/AKfycbzT5Z8RYIKjH0h_Oj7giOgoyTRJlcPbp5kUnoJzZEwKQIYWQqgX6dX6GNtwCoeoVySe/exec"
  style="display:none;"
>
  <input
    type="hidden"
    id="authAction"
    name="action"
  >

  <input
    type="hidden"
    id="authPassword"
    name="password"
  >

  <input
    type="hidden"
    id="authEmail"
    name="email"
  >

  <input
    type="hidden"
    id="authCode"
    name="code"
  >

  <input
    type="hidden"
    id="authSessionToken"
    name="sessionToken"
  >
</form>

  <script>
  const SESSION_STORAGE_KEY =
    'fiveminuteSessionToken';

  let loginStarted = false;


  function createSessionToken() {
    const bytes =
      new Uint8Array(32);

    crypto.getRandomValues(bytes);

    return Array
      .from(bytes)
      .map(byte =>
        byte
          .toString(16)
          .padStart(2, '0')
      )
      .join('');
  }

let pendingEmail = '';

function submitAuthRequest(
  action,
  password,
  email,
  code,
  sessionToken
) {
  document.getElementById(
    'authAction'
  ).value = action || '';

  document.getElementById(
    'authPassword'
  ).value = password || '';

  document.getElementById(
    'authEmail'
  ).value = email || '';

  document.getElementById(
    'authCode'
  ).value = code || '';

  document.getElementById(
    'authSessionToken'
  ).value = sessionToken || '';

  document.getElementById(
    'authForm'
  ).submit();
}


document
  .getElementById('passwordBtn')
  .addEventListener(
    'click',
    function() {
      const password =
        String(
          document
            .getElementById(
              'passwordInput'
            )
            .value || ''
        ).trim();

      if (!password) {
        showError(
          'Введіть пароль.'
        );

        return;
      }

      clearStatus();

      document.getElementById(
        'status'
      ).textContent =
        'Перевіряємо пароль...';
      
      submitAuthRequest(
        'CHECK_PASSWORD',
        password,
        '',
        '',
        ''
      );
    }
  );


document
  .getElementById('emailBtn')
  .addEventListener(
    'click',
    function() {
      const email =
        String(
          document
            .getElementById(
              'emailInput'
            )
            .value || ''
        )
          .trim()
          .toLowerCase();

      if (!email) {
        showError(
          'Введіть email.'
        );

        return;
      }

      pendingEmail =
        email;

      clearStatus();

      submitAuthRequest(
        'SEND_LOGIN_CODE',
        '',
        email,
        '',
        ''
      );
    }
  );


document
  .getElementById('codeBtn')
  .addEventListener(
    'click',
    function() {
      const code =
        String(
          document
            .getElementById(
              'codeInput'
            )
            .value || ''
        ).trim();

      if (!code) {
        showError(
          'Введіть код з листа.'
        );

        return;
      }

      const sessionToken =
        createSessionToken();

      document
        .getElementById(
          'authSessionToken'
        )
        .dataset.pendingToken =
          sessionToken;

      clearStatus();

      submitAuthRequest(
        'VERIFY_LOGIN_CODE',
        '',
        pendingEmail,
        code,
        sessionToken
      );
    }
  );


function clearStatus() {
  const status =
    document.getElementById(
      'status'
    );

  status.classList.remove(
    'error'
  );

  status.textContent = '';
}
    
  window.addEventListener(
    'load',
    function() {

      const savedSession =
        String(
          localStorage.getItem(
            SESSION_STORAGE_KEY
          ) || ''
        ).trim();

      if (!savedSession) {
        return;
      }

      loginStarted = true;

      const status =
        document.getElementById(
          'status'
        );

      status.classList.remove(
        'error'
      );

      status.textContent =
        'Відновлюємо сесію...';

      document.getElementById(
        'sessionTokenInput'
      ).value = savedSession;

      openApp();
    }
  );
 
    let driveAccessToken =
  String(
    sessionStorage.getItem(
      'fiveMinuteDriveAccessToken'
    ) || ''
  ).trim();

    let driveAccessTokenExpiresAt =
  Number(
    sessionStorage.getItem(
      'fiveMinuteDriveAccessTokenExpiresAt'
    ) || 0
  );

    function sendDriveTokenToApp() {
  const frame =
    document.getElementById(
      'appFrame'
    );

  if (
    !frame ||
    !frame.contentWindow ||
    !driveAccessToken
  ) {
    return;
  }

  frame.contentWindow.postMessage(
    {
      type:
        'FIVE_MINUTE_DRIVE_TOKEN',

      accessToken:
        driveAccessToken
    },
    '*'
  );
}


function requestDriveAccess() {

  return new Promise(
    function(resolve, reject) {

      if (
        !window.google ||
        !google.accounts ||
        !google.accounts.oauth2
      ) {
        reject(
          new Error(
            'Google Identity Services ще не завантажено.'
          )
        );

        return;
      }

      const clientId =
        document
          .getElementById('g_id_onload')
          .dataset.client_id;

      const tokenClient =
        google.accounts.oauth2.initTokenClient({

          client_id:
            clientId,

          scope:
            'https://www.googleapis.com/auth/drive.file',

          callback:
            function(tokenResponse) {

              if (
                !tokenResponse ||
                !tokenResponse.access_token
              ) {
                reject(
                  new Error(
                    'Google Drive не повернув access token.'
                  )
                );

                return;
              }

              driveAccessToken =
                tokenResponse.access_token;

              sessionStorage.setItem(
                'fiveMinuteDriveAccessToken',
                driveAccessToken
              );

              driveAccessTokenExpiresAt =
  Date.now() +
  (
    Number(
      tokenResponse.expires_in || 3600
    ) * 1000
  ) -
  60000;

sessionStorage.setItem(
  'fiveMinuteDriveAccessTokenExpiresAt',
  String(
    driveAccessTokenExpiresAt
  )
);

              sendDriveTokenToApp();

              resolve(
                driveAccessToken
              );
            }
        });

      tokenClient.requestAccessToken({
       prompt: ''
      });
    }
  );
}


  function openApp() {

    const frame =
      document.getElementById(
        'appFrame'
      );

    frame.onload =
  function() {

    const loginScreen =
      document.getElementById(
        'loginScreen'
      );

    frame.style.display =
      'block';

    requestAnimationFrame(
      function() {

        requestAnimationFrame(
          function() {

            frame.classList.add(
                'appReady'
            );

            loginScreen.style.opacity =
              '0';

            setTimeout(
              function() {

                loginScreen.style.display =
                  'none';

              },
              220
            );
          }
        );
      }
    );
  };


    document.getElementById(
      'loginForm'
    ).submit();
  }

    window.addEventListener(
  'message',
  function(event) {

    const frame =
      document.getElementById(
        'appFrame'
      );

   
    const data =
      event.data || {};
    if (
  data.type ===
  'PASSWORD_RESULT'
) {
  if (!data.success) {
    showError(
      data.message ||
      'Невірний пароль.'
    );

    return;
  }

  document
    .getElementById(
      'passwordStep'
    )
    .classList.add(
      'hidden'
    );

  document
    .getElementById(
      'emailStep'
    )
    .classList.remove(
      'hidden'
    );

  clearStatus();

  return;
}


if (
  data.type ===
  'EMAIL_RESULT'
) {
  if (!data.success) {
    showError(
      data.message ||
      'Не вдалося підтвердити доступ.'
    );

    return;
  }

  document
    .getElementById(
      'emailStep'
    )
    .classList.add(
      'hidden'
    );

  document
    .getElementById(
      'codeStep'
    )
    .classList.remove(
      'hidden'
    );

  const status =
    document.getElementById(
      'status'
    );

  status.classList.remove(
    'error'
  );

  status.textContent =
    'Код надіслано на email.';

  return;
}


if (
  data.type ===
  'CODE_RESULT'
) {
  if (!data.success) {
    showError(
      data.message ||
      'Невірний код.'
    );

    return;
  }

  const sessionToken =
    String(
      document
        .getElementById(
          'authSessionToken'
        )
        .dataset.pendingToken || ''
    );

  if (!sessionToken) {
    showError(
      'Не вдалося створити сесію.'
    );

    return;
  }

  localStorage.setItem(
    SESSION_STORAGE_KEY,
    sessionToken
  );

  document.getElementById(
    'sessionTokenInput'
  ).value =
    sessionToken;

  loginStarted =
    true;

  openApp();

  return;
}
    if (
  data.type ===
  'FIVE_MINUTE_APP_READY'
) {

  sendDriveTokenToApp();

  return;
}

    if (
      data.type !==
      'FIVEMINUTE_SESSION_EXPIRED'
    ) {
      return;
    }

    localStorage.removeItem(
      SESSION_STORAGE_KEY
    );

    loginStarted = false;

    frame.classList.remove(
      'appReady'
    );

    frame.style.display =
      'none';

    document.getElementById(
      'sessionTokenInput'
    ).value = '';

    const loginScreen =
      document.getElementById(
        'loginScreen'
      );

    loginScreen.style.display =
      'flex';

    loginScreen.style.opacity =
      '1';

    const status =
      document.getElementById(
        'status'
      );

    status.classList.remove(
      'error'
    );

    status.textContent =
      'Сесія завершилася. Увійдіть знову.';
  }
);

  function showError(message) {

    const status =
      document.getElementById(
        'status'
      );

    status.classList.add(
      'error'
    );

    status.textContent =
      message;

    loginStarted = false;
  }
    document
  .getElementById('appFrame')
  .addEventListener(
    'load',
    function() {
      setTimeout(
        sendDriveTokenToApp,
        300
      );
    }
  );
    window.addEventListener(
  'message',
  async function(event) {

    const data =
      event.data || {};

    if (
      data.type !==
      'FIVE_MINUTE_DIRECT_UPLOAD'
    ) {
      return;
    }

    const source =
      event.source;

    const requestId =
      data.requestId;

    try {

      if (
  !driveAccessToken ||
  !driveAccessTokenExpiresAt ||
  Date.now() >= driveAccessTokenExpiresAt
) {

  await requestDriveAccess();

  if (!driveAccessToken) {
    throw new Error(
      'Немає доступу до Google Drive.'
    );
  }
}

      const file =
        data.file;

      if (!file) {
        throw new Error(
          'Не отримано файл.'
        );
      }

      const metadata = {
        name: file.name,
        parents: [
          '19Zekb7SweV7TFScs9-P9N_Y8XE4sqZZA'
        ]
      };

      const boundary =
  '-------fiveMinuteBoundary' +
  Date.now();

const delimiter =
  '\r\n--' +
  boundary +
  '\r\n';

const closeDelimiter =
  '\r\n--' +
  boundary +
  '--';

const metadataPart =
  delimiter +
  'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
  JSON.stringify(metadata) +
  delimiter +
  'Content-Type: ' +
  (
    file.type ||
    'application/octet-stream'
  ) +
  '\r\n\r\n';

const body =
  new Blob(
    [
      metadataPart,
      file,
      closeDelimiter
    ],
    {
      type:
        'multipart/related; boundary=' +
        boundary
    }
  );

const response =
  await fetch(
    'https://www.googleapis.com/upload/drive/v3/files' +
    '?uploadType=multipart' +
    '&fields=id,name,mimeType,size',
    {
      method: 'POST',

      headers: {
        Authorization:
          'Bearer ' +
          driveAccessToken,

        'Content-Type':
          'multipart/related; boundary=' +
          boundary
      },

      body:
        body
    }
  );

      const result =
        await response.json();

      if (!response.ok) {
        throw new Error(
          result?.error?.message ||
          'Помилка Google Drive.'
        );
      }

      source.postMessage(
        {
          type:
            'FIVE_MINUTE_DIRECT_UPLOAD_RESULT',

          requestId:
            requestId,

          success:
            true,

          file:
            result
        },
        '*'
      );

    } catch (error) {

      source.postMessage(
        {
          type:
            'FIVE_MINUTE_DIRECT_UPLOAD_RESULT',

          requestId:
            requestId,

          success:
            false,

          error:
            error?.message ||
            String(error)
        },
        '*'
      );
    }
  }
);
</script>

</body>
</html>
