<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.0" result="b1"/>
      <feGaussianBlur stdDeviation="4.8" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowGold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b1"/>
      <feGaussianBlur stdDeviation="4.5" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <path
      d="M 28 290
         C 175 311, 320 340, 461 377
         C 603 414, 728 452, 846 468
         C 966 484, 1077 470, 1186 435
         C 1295 399, 1398 347, 1517 290"
      stroke="#67ffb4"
      stroke-width="4"
      stroke-dasharray="30 320"
      stroke-dashoffset="-20"
      filter="url(#glowGreen)">
      <animate attributeName="stroke-dashoffset" from="-20" to="-730" dur="8.5s" repeatCount="indefinite"/>
    </path>

    <path
      d="M 175 876
         C 312 802, 434 735, 548 668
         C 660 601, 760 534, 849 458
         C 940 380, 1029 301, 1122 238
         C 1216 174, 1310 128, 1438 90"
      stroke="#ffd56f"
      stroke-width="3.8"
      stroke-dasharray="26 305"
      stroke-dashoffset="-95"
      filter="url(#glowGold)">
      <animate attributeName="stroke-dashoffset" from="-95" to="-755" dur="9.3s" repeatCount="indefinite"/>
    </path>

    <path
      d="M 678 474
         C 789 469, 895 454, 997 425
         C 1103 395, 1205 349, 1307 294
         C 1407 240, 1500 196, 1607 160"
      stroke="#69ffb4"
      stroke-width="3.6"
      stroke-dasharray="22 285"
      stroke-dashoffset="-150"
      filter="url(#glowGreen)">
      <animate attributeName="stroke-dashoffset" from="-150" to="-720" dur="9.8s" repeatCount="indefinite"/>
    </path>

    <path
      d="M 1100 246
         C 1172 286, 1238 335, 1292 389
         C 1347 444, 1390 504, 1434 568"
      stroke="#ffd36d"
      stroke-width="3.4"
      stroke-dasharray="20 250"
      stroke-dashoffset="-55"
      filter="url(#glowGold)">
      <animate attributeName="stroke-dashoffset" from="-55" to="-515" dur="10.1s" repeatCount="indefinite"/>
    </path>

  </g>
</svg>
